name: Website

on:
  push:
    branches: [main]
    paths:
      - 'Documentation~/website/**'
      - 'Tools~/**'
      - 'LICENSE.txt'
      - 'NOTICE.txt'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Documentation~/website/**'
      - 'Tools~/**'
      - 'LICENSE.txt'
      - 'NOTICE.txt'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

# Compare, deploy and notify in order, without overlapping deployments.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check publication and automation
        run: |
          node --test Tools~/privacy.test.mjs Tools~/website.test.mjs
          node Tools~/privacy.mjs check-commit HEAD
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: Documentation~/website/package.json
      - name: Install and build
        working-directory: Documentation~/website
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Record built revision and pages
        run: node Tools~/website.mjs stamp Documentation~/website/docs/.vitepress/dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: Documentation~/website/docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Read the artifact from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name github-pages --dir pages-artifact
          mkdir site
          tar -xf pages-artifact/artifact.tar -C site
      - name: Compare with the previous live publication
        run: node Tools~/website.mjs plan site indexnow-plan.json
      - name: Deploy directly to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check the live manual
        run: |
          node Tools~/website.mjs wait-live "$GITHUB_SHA"
          node Tools~/website.mjs check
      - name: Notify IndexNow after publication
        run: node Tools~/website.mjs notify indexnow-plan.json
